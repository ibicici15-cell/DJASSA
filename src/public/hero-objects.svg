<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">

  <!-- Smartphone -->
  <g transform="translate(70,40) rotate(-8)" fill="#F0783A">
    <rect x="0" y="0" width="46" height="82" rx="8"/>
    <rect x="14" y="68" width="18" height="4" rx="2" fill="#14283A"/>
  </g>

  <!-- T-shirt -->
  <g transform="translate(190,60) rotate(6)" fill="#E8B84B">
    <path d="M20 0 L0 16 L10 30 L18 24 L18 70 L52 70 L52 24 L60 30 L70 16 L50 0 Q35 12 20 0 Z"/>
  </g>

  <!-- Sac (deux anses distinctes) -->
  <g transform="translate(460,50) rotate(5)" fill="none" stroke="#6B93C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 22 L10 14 Q10 4 18 4" />
    <path d="M42 22 L42 14 Q42 4 34 4" />
    <rect x="0" y="22" width="52" height="44" rx="6" fill="#6B93C7" stroke="none"/>
    <line x1="4" y1="34" x2="48" y2="34" stroke="#14283A" stroke-width="3"/>
  </g>

  <!-- Ampoule -->
  <g transform="translate(700,50)" fill="#E8B84B">
    <circle cx="20" cy="20" r="20"/>
    <rect x="12" y="38" width="16" height="10" rx="3" fill="#14283A"/>
  </g>

  <!-- Étiquette de prix -->
  <g transform="translate(800,180) rotate(-10)" fill="#F0783A">
    <path d="M0 20 L20 0 L56 0 L56 36 L20 56 Z"/>
    <circle cx="14" cy="14" r="5" fill="#14283A"/>
  </g>

  <!-- Livre -->
  <g transform="translate(900,40) rotate(8)">
    <path d="M0 4 L28 0 L28 60 L0 64 Z" fill="#3F9D6B"/>
    <path d="M28 0 L56 4 L56 64 L28 60 Z" fill="#2F8058"/>
  </g>

  <!-- Casque audio -->
  <g transform="translate(1000,190) rotate(-5)" fill="none" stroke="#C24F87" stroke-width="4" stroke-linecap="round">
    <path d="M2 40 L2 26 Q2 0 30 0 Q58 0 58 26 L58 40"/>
    <rect x="-4" y="36" width="16" height="24" rx="5" fill="#C24F87" stroke="none"/>
    <rect x="50" y="36" width="16" height="24" rx="5" fill="#C24F87" stroke="none"/>
  </g>

  <!-- Voiture -->
  <g transform="translate(310,190) rotate(-4)" fill="#6B93C7">
    <path d="M4 34 L14 12 Q20 4 32 4 L64 4 Q76 4 82 12 L92 34 Z"/>
    <rect x="0" y="34" width="96" height="18" rx="4"/>
    <circle cx="22" cy="54" r="9" fill="#14283A"/>
    <circle cx="74" cy="54" r="9" fill="#14283A"/>
  </g>

  <!-- Fauteuil / canapé -->
  <g transform="translate(570,200) rotate(-3)" fill="#F0783A">
    <path d="M0 30 L0 14 Q0 4 10 4 L14 4 Q20 4 20 14 L20 26 L70 26 L70 14 Q70 4 76 4 L80 4 Q90 4 90 14 L90 30 L90 55 L0 55 Z"/>
    <rect x="2" y="55" width="6" height="10" fill="#14283A"/>
    <rect x="82" y="55" width="6" height="10" fill="#14283A"/>
  </g>

  <!-- Clé à molette -->
  <g transform="translate(1080,55) rotate(-25)" fill="none" stroke="#E8B84B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 10 Q0 0 10 0 Q20 0 20 10 Q20 16 14 18 L14 60 L6 60 L6 18 Q0 16 0 10 Z"/>
  </g>

  <!-- Chaussure -->
  <g transform="translate(150,300) rotate(2)" fill="#3F9D6B">
    <path d="M0 30 Q0 10 20 10 Q26 10 30 4 Q34 0 40 4 L58 16 Q66 20 66 28 L66 34 L0 34 Z"/>
  </g>

  <!-- Casquette -->
  <g transform="translate(400,300)" fill="#C24F87">
    <path d="M0 20 Q20 0 40 20 L40 24 L0 24 Z"/>
    <path d="M40 16 L60 20 L40 24 Z"/>
  </g>

  <!-- Vélo -->
  <g transform="translate(650,300) rotate(-2)" fill="none" stroke="#F0783A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="30" r="14"/>
    <circle cx="74" cy="30" r="14"/>
    <path d="M14 30 L34 10 L54 10 L74 30 M34 10 L44 30 L14 30 M44 30 L74 30"/>
  </g>

  <!-- Tasse -->
  <g transform="translate(950,290) rotate(4)" fill="#6B93C7">
    <path d="M0 6 L36 6 L34 40 Q34 48 24 48 L12 48 Q2 48 2 40 Z"/>
    <path d="M36 12 Q50 12 50 24 Q50 36 36 34 Z" fill="none" stroke="#6B93C7" stroke-width="5"/>
  </g>

</svg>
